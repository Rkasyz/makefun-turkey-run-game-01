<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f2c230'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle'%3E🦃%3C/text%3E%3C/svg%3E">
<title>Biscuit's Great Escape — a Thanksgiving turkey breakout</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #2b1a12;
    overflow: hidden; font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
  }
  #wrap {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 100% at 50% 0%, #4a2c1c 0%, #2b1a12 70%);
  }
  canvas {
    display: block; background: #f7b267; border-radius: 10px;
    box-shadow: 0 18px 60px rgba(0,0,0,.55), 0 0 0 4px #7c4a21;
    max-width: 100vw; max-height: 100vh; cursor: pointer;
  }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 8px; text-align: center;
    color: #e8c9a0; font-size: 12px; letter-spacing: .04em; opacity: .75;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="480"></canvas></div>
<div id="hint">SPACE / click — flap-jump &nbsp;·&nbsp; DOWN — duck &nbsp;·&nbsp; P — pause &nbsp;·&nbsp; M — sound</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
